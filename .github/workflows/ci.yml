name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  desktop-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-agent/package-lock.json
      # desktop-agent sources import shared modules from ../src/lib, which resolve
      # their dependencies (zod, @xyflow/react, …) from the repository root — install
      # root deps first (proven by the web job).
      - run: npm ci
      # robotjs is a native module and Electron downloads a large binary on install;
      # the tests exercise the mock driver, so install without scripts (no node-gyp needed).
      - run: npm --prefix desktop-agent ci --ignore-scripts
      - run: npm --prefix desktop-agent run typecheck --if-present
      - run: npm run desktop:test
